name: Examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  run-examples:
    name: Run Working Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: examples

      - name: Build Ryo compiler
        run: cargo build --release

      - name: Run examples
        run: |
          for file in examples/*.ryo; do
            echo "=== Running $file ==="
            if [[ "$file" == *"panic.ryo" || "$file" == *"div_zero.ryo" ]]; then
              # panic.ryo (explicit panic()) and div_zero.ryo (integer
              # division guard) are intentional-panic examples: expect
              # non-zero
              if ./target/release/ryo run "$file"; then
                echo "Error: $file was expected to panic but succeeded"
                exit 1
              else
                echo "Expected panic occurred successfully"
              fi
            elif [[ "$file" == *"oracle.ryo" ]]; then
              # oracle.ryo is interactive (argv + io_read_line): with a name
              # and closed stdin it asks one question, then takes the EOF
              # exit (io_eprint + process_exit(1))
              if ./target/release/ryo run "$file" ci-smoke </dev/null; then
                echo "Error: $file was expected to exit non-zero on EOF but succeeded"
                exit 1
              else
                echo "Expected EOF exit occurred successfully"
              fi
            else
              # Expect other examples to succeed with 0
              ./target/release/ryo run "$file"
            fi
          done
