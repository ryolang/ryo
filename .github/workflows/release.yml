name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if commit unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-shared.yml
    with:
      force: ${{ inputs.force }}
      title_prefix: Dev
    secrets: inherit
