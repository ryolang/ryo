name: CodSpeed

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "landing/**"
      - "examples/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "landing/**"
      - "examples/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  frontend-benchmarks:
    name: Run Frontend Simulation Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: codspeed-frontend
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build the benchmark target
        run: cargo codspeed build -p ryo-frontend
      - name: Run frontend benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run -p ryo-frontend

  backend-benchmarks:
    name: Run Backend Simulation Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: codspeed-backend
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build the benchmark target
        run: cargo codspeed build -p ryo-backend
      - name: Run backend benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run -p ryo-backend

  aot-benchmarks:
    name: Run AOT Walltime Benchmarks
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: codspeed-aot
      - name: Build Ryo compiler
        run: cargo build --release
      - name: Compile Ryo AOT binaries
        # `ryo build` writes the binary next to the source.
        run: |
          ./target/release/ryo build benchmarks/fibonacci/fib.ryo
          ./target/release/ryo build benchmarks/eager_destruction/eager_destruction.ryo
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Run E2E AOT benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime

  aot-benchmarks-memory:
    name: Run AOT Memory Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: codspeed-aot-memory
      - name: Build Ryo compiler
        run: cargo build --release
      - name: Compile Ryo AOT binaries
        # `ryo build` writes the binary next to the source.
        run: |
          ./target/release/ryo build benchmarks/fibonacci/fib.ryo
          ./target/release/ryo build benchmarks/eager_destruction/eager_destruction.ryo
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Run E2E AOT memory benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: memory
