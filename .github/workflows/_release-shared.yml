name: Release Build & Publish

# Shared by release.yml (manual) and nightly.yml (scheduled). Callers gate
# whether this runs and provide the title wording; this workflow computes
# the dev-YYYYMMDD-<hash> tag, builds all platforms, and publishes.

on:
  workflow_call:
    inputs:
      force:
        description: "Force rebuild even if the release already exists"
        required: false
        default: false
        type: boolean
      title_prefix:
        description: "Release title/wording prefix (e.g. Dev, Nightly)"
        required: false
        default: "Dev"
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check if build needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_hash: ${{ steps.info.outputs.short_hash }}
      date: ${{ steps.info.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get commit info
        id: info
        run: |
          echo "short_hash=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          TAG: dev-${{ steps.info.outputs.date }}-${{ steps.info.outputs.short_hash }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: release $TAG already exists"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ryo-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: ryo-linux-arm64
          - os: macos-latest
            artifact_name: ryo-macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          SHORT_HASH: ${{ needs.check.outputs.short_hash }}
        run: |
          ASSET_NAME="${ARTIFACT_NAME}-${SHORT_HASH}.tar.gz"
          mkdir staging
          cp target/release/ryo staging/ryo
          tar czf "${ASSET_NAME}" -C staging ryo
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ASSET_NAME }}
          retention-days: 1

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify artifacts before replacing releases
        run: |
          shopt -s globstar nullglob
          ASSETS=(artifacts/**/*.tar.gz)
          echo "Found ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"
          if [[ ${#ASSETS[@]} -ne 3 ]]; then
            echo "Expected 3 platform assets, found ${#ASSETS[@]}." >&2
            echo "Aborting without deleting the existing releases." >&2
            exit 1
          fi

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_PREFIX: ${{ inputs.title_prefix }}
          SHORT_HASH: ${{ needs.check.outputs.short_hash }}
          DATE: ${{ needs.check.outputs.date }}
          REPO_NAME: ${{ github.repository }}
        run: |
          TAG="dev-${DATE}-${SHORT_HASH}"
          NOTES="${TITLE_PREFIX} build from \`main\` at ${SHORT_HASH} (${DATE}).

          Install:
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${REPO_NAME}/main/install.sh | sh
          \`\`\`"

          shopt -s globstar nullglob
          ASSETS=()
          for asset in artifacts/**/*.tar.gz; do
            ASSETS+=("$asset")
          done

          # Recovery path: a forced rebuild can collide with an existing
          # release or bare tag of the same name — replace just that one.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Replacing existing release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          else
            # A tag can also exist on the remote without a release (interrupted
            # run, manual push), and gh release create refuses to reuse it.
            # Dereference annotated tags to compare commit targets.
            TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
            if [ -z "$TAG_SHA" ]; then
              TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
            fi
            if [ -n "$TAG_SHA" ]; then
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "Remote tag $TAG points to ${TAG_SHA}, not ${GITHUB_SHA}." >&2
                echo "Refusing to republish it from this run — remove the tag manually." >&2
                exit 1
              fi
              echo "Removing stale tag $TAG (no release, same commit)"
              git push origin --delete "refs/tags/${TAG}"
            fi
          fi

          # --target pins the tag to the commit that was actually built —
          # the default branch may have moved on since this run started.
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "${TITLE_PREFIX} ${DATE} (${SHORT_HASH})" --prerelease --notes "$NOTES"

      - name: Delete previous dev releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: dev-${{ needs.check.outputs.date }}-${{ needs.check.outputs.short_hash }}
        run: |
          # The new release is already live at this point — only retire the
          # older dev releases, and never the one we just created.
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("dev-"))'); do
            if [[ "$tag" == "$TAG" ]]; then
              continue
            fi
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
