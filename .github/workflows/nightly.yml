name: Nightly Release

on:
  schedule:
    # 05:23 UTC daily
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if commit unchanged"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check if build needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_hash: ${{ steps.info.outputs.short_hash }}
      date: ${{ steps.info.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get commit info
        id: info
        run: |
          echo "short_hash=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Check for code changes since last release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          SHORT_HASH: ${{ steps.info.outputs.short_hash }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag records which commit the last release was built from
          # (same dev-YYYYMMDD-<hash> convention as release.yml). If it
          # matches HEAD, no code has changed since the last release.
          LAST_TAG=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(startswith("dev-"))] | .[0] // ""')
          LAST_HASH="${LAST_TAG##*-}"
          if [[ -n "$LAST_HASH" && "$LAST_HASH" == "$SHORT_HASH" ]]; then
            echo "No code changes since release $LAST_TAG — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ryo-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: ryo-linux-arm64
          - os: macos-latest
            artifact_name: ryo-macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          SHORT_HASH: ${{ needs.check.outputs.short_hash }}
        run: |
          ASSET_NAME="${ARTIFACT_NAME}-${SHORT_HASH}.tar.gz"
          mkdir staging
          cp target/release/ryo staging/ryo
          tar czf "${ASSET_NAME}" -C staging ryo
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ASSET_NAME }}
          retention-days: 1

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify artifacts before replacing releases
        run: |
          shopt -s globstar nullglob
          ASSETS=(artifacts/**/*.tar.gz)
          echo "Found ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"
          if [[ ${#ASSETS[@]} -ne 3 ]]; then
            echo "Expected 3 platform assets, found ${#ASSETS[@]}." >&2
            echo "Aborting without deleting the existing releases." >&2
            exit 1
          fi

      - name: Delete previous dev releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("dev-"))'); do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_HASH: ${{ needs.check.outputs.short_hash }}
          DATE: ${{ needs.check.outputs.date }}
          REPO_NAME: ${{ github.repository }}
        run: |
          TAG="dev-${DATE}-${SHORT_HASH}"
          NOTES="Nightly build from \`main\` at ${SHORT_HASH} (${DATE}).

          Install:
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${REPO_NAME}/main/install.sh | sh
          \`\`\`"

          shopt -s globstar nullglob
          ASSETS=()
          for asset in artifacts/**/*.tar.gz; do
            ASSETS+=("$asset")
          done

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Nightly ${DATE} (${SHORT_HASH})" --prerelease --notes "$NOTES"
