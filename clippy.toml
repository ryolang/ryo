# Clippy configuration for the Ryo compiler workspace.
# Enforces rules from docs/dev/ryo-compiler-llm-instructions.md; lint levels
# live in the root Cargo.toml `[workspace.lints]` table.

# R1 — flat arrays and typed indices, never pointer trees.
# These are hard-denied: the tree is clean today, so this is a ratchet.
disallowed-types = [
    { path = "std::rc::Rc", reason = "R1: use flat Vecs with u32 newtype indices, not reference-linked structures" },
    { path = "std::rc::Weak", reason = "R1: use flat Vecs with u32 newtype indices, not reference-linked structures" },
    { path = "std::cell::RefCell", reason = "R1: indices are Copy; no runtime borrow-checking in compiler data structures" },
]

# R7 — small functions (target < 50 lines). 500 is a ratchet just above the
# current worst offender (`visit_expr`, ~411 lines, I-128). Lower towards 50
# as the oversized pass entry points are split.
too-many-lines-threshold = 500

# R8 — the workspace warns on unwrap/expect/panic; tests may use them freely.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
