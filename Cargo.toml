[workspace]
resolver = "3"
members = [
    "build-support",
    "runtime",
    "ryo-core",
    "ryo-frontend",
    "ryo-backend",
    "ryo-driver",
    "ryo",
]
default-members = ["ryo"]

[workspace.package]
rust-version = "1.97.0"

[workspace.dependencies]
ariadne = "0.6"
chumsky = "0.12"
hashbrown = "0.17"
clap = { version = "4.6", features = ["derive"] }
cranelift = "0.133"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-object = "0.131"
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
logos = "0.16"
tar = "0.4"
target-lexicon = "0.13.5"
ureq = "3"
dirs = "6"
sha2 = "0.11"
tempfile = "3.27"
ryo-runtime = { path = "runtime" }
ryo-core = { path = "ryo-core" }
ryo-frontend = { path = "ryo-frontend" }
ryo-backend = { path = "ryo-backend" }
ryo-driver = { path = "ryo-driver" }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

# Lint policy derived from docs/dev/ryo-compiler-llm-instructions.md.
# Compiler crates opt in with `[lints] workspace = true`; `runtime/` is the
# curated FFI/unsafe boundary (R5) and deliberately does not.
[workspace.lints.rust]
# R5 — no `unsafe` in the compiler. The two grandfathered sites carry
# `#[allow(unsafe_code)]` with a SAFETY comment + linked issue (I-127).
unsafe_code = "deny"

[workspace.lints.clippy]
# R1 — flat arrays and typed indices, never pointer trees. The banned types
# are listed with reasons in clippy.toml (`disallowed-types`).
disallowed_types = "deny"
# R7 — small functions. `too-many-lines-threshold` in clippy.toml is a
# ratchet set just above today's worst offender (I-128); lower it as the
# oversized pass entry points are split.
too_many_lines = "deny"
# R8/R13 — never panic on user input, no `todo!()` in shipped milestones.
# These stay `allow` for now: CI builds with RUSTFLAGS=-Dwarnings, so even
# `warn` fails the build, and the existing call sites (tracked as I-103,
# I-106; I-107 and I-115 already fixed) must be converted before these can
# be promoted to `warn` and then `deny`. Tests are exempt via clippy.toml.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"
