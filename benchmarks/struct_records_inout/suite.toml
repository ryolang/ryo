# Benchmark suite manifest for the centralized runner (benchmarks/run.py).
# Transcribed from run_benchmarks.sh (see ISSUES.md I-174): every run/build
# line, arm name, and warmup value matches the old script byte-for-byte
# (modulo the $ryo substitution point for the ryo binary path).
name = "struct_records_inout"
descriptor = "500,000 record build-mutate-score rounds — inout update"
warmup = 3
expect = "assert passed, struct_records_inout is correct"

[[arm]]
name = "Rust"
language = "rust"
build = "rustc -O struct_records_inout.rs -o struct_records_inout_rs"
run = "./struct_records_inout_rs"

[[arm]]
name = "Swift"
language = "swift"
build = "swiftc -O struct_records_inout.swift -o struct_records_inout_swift"
run = "./struct_records_inout_swift"

[[arm]]
name = "Go"
language = "go"
build = "go build -o struct_records_inout_go struct_records_inout.go"
run = "./struct_records_inout_go"
version = "go version | cut -d' ' -f3 | sed 's/^go//'"

[[arm]]
name = "Python"
language = "python"
run = "python3 struct_records_inout.py"
version = "python3 --version | cut -d' ' -f2"

[[arm]]
name = "Ryo (AOT)"
language = "ryo"
build = "(cd ../.. && cargo build --release > /dev/null) && $ryo build struct_records_inout.ryo > /dev/null"
run = "./struct_records_inout"
version = "$ryo --version 2>&1 || echo 'dev'"

[[arm]]
name = "Ryo (JIT)"
language = "ryo"
run = "$ryo run struct_records_inout.ryo"
version = "$ryo --version 2>&1 || echo 'dev'"
