# Benchmark suite manifest for the centralized runner (benchmarks/run.py).
# Transcribed from run_benchmarks.sh (per-suite scripts deleted when the runner was centralized): every run/build
# line, arm name, and warmup value matches the old script byte-for-byte
# (modulo the $ryo substitution point for the ryo binary path).
name = "struct_records"
category = "Structs"
descriptor = "500,000 record build-update-score rounds — consuming update"
warmup = 3
expect = "assert passed, struct_records is correct"

[[arm]]
name = "Rust"
language = "rust"
build = "rustc -O struct_records.rs -o struct_records_rs"
run = "./struct_records_rs"

[[arm]]
name = "Swift"
language = "swift"
build = "swiftc -O struct_records.swift -o struct_records_swift"
run = "./struct_records_swift"

[[arm]]
name = "Go"
language = "go"
build = "go build -o struct_records_go struct_records.go"
run = "./struct_records_go"
version = "go version | cut -d' ' -f3 | sed 's/^go//'"

[[arm]]
name = "Python"
language = "python"
run = "uv run --python 3.15 struct_records.py"
version = "uv run --python 3.15 python --version | awk '{print $2}'"

[[arm]]
name = "Ryo (AOT)"
language = "ryo"
build = "(cd ../.. && cargo build --release > /dev/null) && $ryo build struct_records.ryo > /dev/null"
run = "./struct_records"
version = "$ryo --version 2>&1 || echo 'dev'"

[[arm]]
name = "Ryo (JIT)"
language = "ryo"
run = "$ryo run struct_records.ryo"
version = "$ryo --version 2>&1 || echo 'dev'"
