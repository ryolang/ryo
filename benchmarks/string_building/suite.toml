# Benchmark suite manifest for the centralized runner (benchmarks/run.py).
# Transcribed from run_benchmarks.sh (see ISSUES.md I-174): every run/build
# line, arm name, and warmup value matches the old script byte-for-byte
# (modulo the $ryo substitution point for the ryo binary path).
name = "string_building"
descriptor = "50,000 reassign-concat iterations — string runtime ABI measure"
warmup = 3

[[arm]]
name = "Rust"
language = "rust"
build = "rustc -O string_building.rs -o string_building_rs"
run = "./string_building_rs"

[[arm]]
name = "Swift"
language = "swift"
build = "swiftc -O string_building.swift -o string_building_swift"
run = "./string_building_swift"

[[arm]]
name = "Ryo (AOT)"
language = "ryo"
build = "(cd ../.. && cargo build --release > /dev/null) && $ryo build string_building.ryo > /dev/null"
run = "./string_building"
version = "$ryo --version 2>&1 || echo 'dev'"

[[arm]]
name = "Ryo (JIT)"
language = "ryo"
run = "$ryo run string_building.ryo"
version = "$ryo --version 2>&1 || echo 'dev'"

[[arm]]
name = "Python"
language = "python"
run = "python3 string_building.py"
version = "python3 --version | cut -d' ' -f2"
