# Benchmark suite manifest for the centralized runner (benchmarks/run.py).
# Transcribed from run_benchmarks.sh (see ISSUES.md I-174): every run/build
# line, arm name, and warmup value matches the old script byte-for-byte
# (modulo the $ryo substitution point for the ryo binary path).
name = "doubling_concat"
descriptor = "20 doublings, 16 B to 16 MiB — fresh-buffer concat path"
warmup = 3

[[arm]]
name = "Rust"
language = "rust"
build = "rustc -O doubling_concat.rs -o doubling_concat_rs"
run = "./doubling_concat_rs"

[[arm]]
name = "Swift"
language = "swift"
build = "swiftc -O doubling_concat.swift -o doubling_concat_swift"
run = "./doubling_concat_swift"

[[arm]]
name = "Ryo (AOT)"
language = "ryo"
build = "(cd ../.. && cargo build --release > /dev/null) && $ryo build doubling_concat.ryo > /dev/null"
run = "./doubling_concat"
version = "$ryo --version 2>&1 || echo 'dev'"

[[arm]]
name = "Ryo (JIT)"
language = "ryo"
run = "$ryo run doubling_concat.ryo"
version = "$ryo --version 2>&1 || echo 'dev'"
