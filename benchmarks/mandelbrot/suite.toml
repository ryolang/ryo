# Benchmark suite manifest for the centralized runner (benchmarks/run.py).
# Transcribed from run_benchmarks.sh (per-suite scripts deleted when the runner was centralized): every run/build
# line, arm name, and warmup value matches the old script byte-for-byte
# (modulo the $ryo substitution point for the ryo binary path).
name = "mandelbrot"
descriptor = "401x501 grid, max 80 iterations — float codegen"
warmup = 3

[[arm]]
name = "Rust"
language = "rust"
build = "rustc -O mandelbrot.rs -o mandelbrot_rs"
run = "./mandelbrot_rs"

[[arm]]
name = "Swift"
language = "swift"
build = "swiftc -O mandelbrot.swift -o mandelbrot_swift"
run = "./mandelbrot_swift"

[[arm]]
name = "Ryo (AOT)"
language = "ryo"
build = "(cd ../.. && cargo build --release > /dev/null) && $ryo build mandelbrot.ryo > /dev/null"
run = "./mandelbrot"
version = "$ryo --version 2>&1 || echo 'dev'"

[[arm]]
name = "Ryo (JIT)"
language = "ryo"
run = "$ryo run mandelbrot.ryo"
version = "$ryo --version 2>&1 || echo 'dev'"
