[package]
name = "ryo-backend"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
ryo-core = { workspace = true }
ryo-runtime = { workspace = true }
cranelift = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-object = { workspace = true }
target-lexicon = { workspace = true }
ureq = { workspace = true }
tar = { workspace = true }
xz2 = { workspace = true }
zip = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
build-support = { path = "../build-support" }

[dev-dependencies]
# Tests build ISAs for foreign triples (e.g. the Windows x64 ABI on a macOS
# host); without these features cranelift-codegen only compiles the host arch.
cranelift-codegen = { version = "0.135", features = ["x86", "arm64"] }
tempfile = { workspace = true }
ryo-frontend = { workspace = true }
chumsky = { workspace = true }
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

[[bench]]
name = "backend"
harness = false

[lints]
workspace = true
